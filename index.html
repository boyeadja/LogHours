<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airix Internship Hours Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Airix Internship Tracker</h1>
            <div class="progress-container">
                <div class="progress-stats">
                    <span id="total-hours-display">0 / 240 Hours Completed</span>
                    <span id="percentage-display">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h2>Log New Hours</h2>
                <form id="log-form">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="start-time">Start Time</label>
                        <input type="time" id="start-time" required>
                    </div>
                    <div class="form-group">
                        <label for="end-time">End Time</label>
                        <input type="time" id="end-time" required>
                    </div>
                    <div class="form-group">
                        <label for="break-time">Break</label>
                        <select id="break-time">
                            <option value="0">No Break</option>
                            <option value="30">30 Mins</option>
                            <option value="60">1 Hour</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="What did you work on?" required>
                    </div>
                    <button type="submit" class="submit-btn">Add Entry</button>
                </form>
            </section>

            <section class="table-section">
                <h2>Timesheet</h2>
                <div class="table-responsive">
                    <table id="logs-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Break</th>
                                <th>Hours</th>
                                <th>Description</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body">
                            <!-- Rows injected by TypeScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
